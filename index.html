<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
<title>Блокнот заказов запчастей | Компактные позиции</title>
<script src="https://accounts.google.com/gsi/client" async defer></script>
<script src="https://apis.google.com/js/api.js"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
*{box-sizing:border-box;}
body{margin:0;padding:12px;font-family:system-ui, -apple-system, 'Segoe UI', Roboto, Arial;background:#f4f6fa;color:#1a2f40;}
.wrapper{max-width:780px;margin:0 auto;}
.form-card{background:white;border-radius:24px;padding:18px 16px;margin-bottom:20px;border:1px solid #eef2f6;box-shadow:0 2px 6px rgba(0,0,0,0.02);}
.form-title{font-weight:600;font-size:17px;margin-bottom:14px;color:#1a2f40;display:flex;align-items:center;gap:8px;border-left:3px solid #1a2f40;padding-left:10px;}
/* Компактные базовые поля */
input,select,button{width:100%;padding:10px 14px;margin-bottom:14px;border:1px solid #e2e8f0;border-radius:18px;font-size:15px;background:#fff;color:#1a2f40;transition:0.2s;}
input:focus,select:focus{outline:none;border-color:#dc143c;box-shadow:0 0 0 2px rgba(220,20,60,0.1);}

/* Строка позиции: максимально компактно, но удобно */
.double-input-row {
    display: flex;
    gap: 8px;
    align-items: center;
}
.part-field {
    flex: 2.2;
}
.qty-field {
    flex: 0.9;
}
.qty-field input {
    min-width: 70px;
}
.remove-icon {
    flex: 0 0 36px;
    display: flex;
    justify-content: center;
    align-items: center;
    background: transparent;
    border: none;
    color: #9aa9bf;
    font-size: 18px;
    cursor: pointer;
    padding: 0;
    margin: 0;
    transition: 0.2s;
    border-radius: 30px;
    width: 36px;
    height: 40px;
}
.remove-icon:hover {
    background: #fee2e2;
    color: #dc143c;
}
.remove-icon:active { transform: scale(0.92);}

.items-container {
    margin-top: 6px;
    margin-bottom: 12px;
}
.position-item {
    background: #fafcff;
    border-radius: 18px;
    padding: 8px 10px;
    margin-bottom: 10px;
    border: 1px solid #edf2f9;
}
.add-position-btn {
    background: #f0f3f8;
    color: #1a2f40;
    border: 1px solid #dce3ec;
    font-weight: 500;
    font-size: 14px;
    padding: 9px 12px;
    margin-top: 2px;
    margin-bottom: 12px;
    transition: 0.2s;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
}
.add-position-btn:active { transform: scale(0.98);}

/* Кнопки действий */
.save-btn{background:#1a2f40;margin-top:6px; padding:12px; font-size:15px;}
.refresh-btn-under{background:#1a2f40;padding:12px; font-size:14px;}
.button-group{display:flex;flex-direction:column;gap:8px;margin-top:6px;}

/* Карточки заказов - чуть компактнее */
.card{background:#ffffff;border-radius:20px;margin-bottom:14px;overflow:hidden;border:1px solid #eef2f6;}
.order-table td{padding:10px 14px;font-size:13px;}
.order-table td:first-child{width:36%;}
.status-select{padding:5px 10px;border-radius:18px;font-size:12px;}
.action-bar{padding:8px 14px 14px;}
.action-btn{padding:8px 12px;font-size:13px;}

/* Фильтры компактнее */
.filter-section{gap:8px;margin-bottom:6px;}
.filter-group select{padding:8px 12px;font-size:13px;}
.search-box{padding:10px 14px;font-size:14px;margin-top:4px;}
.filter-search-container{margin-bottom:8px;}
.refresh-btn-under{ background:#1a2f40;}

/* Тосты */
.toast{
    bottom:20px;
    padding:12px 24px;
    font-size:14px;
    min-width:240px;
}
.toast i{margin-right:6px;}
.empty-state{padding:32px 16px; font-size:14px;}
.loading-spinner{width:28px;height:28px;}

/* Убираем лишние отступы у последнего элемента */
.position-item:last-child{margin-bottom:0;}
input[type=number]::-webkit-inner-spin-button, 
input[type=number]::-webkit-outer-spin-button{opacity:0.5;}
</style>
</head>
<body>
<div class="wrapper">
    <div id="login-section">
        <div id="login-container">
            <div class="login-icon"><i class="fas fa-clipboard-list" style="font-size:36px;color:#1a2f40;"></i></div>
            <h2 style="color:#1a2f40; font-size:22px;">ЗАПЧАСТИ</h2>
            <p style="color:#4b5565; font-size:14px;">Учёт заказов для боулинг-клубов</p>
            <div id="g_id_onload" data-client_id="328749588235-bgfeukqogpoq2ha65j7j0vk840hctiaq.apps.googleusercontent.com" data-callback="handleCredentialResponse" data-auto_prompt="false"></div>
            <div class="g_id_signin" data-type="standard" data-shape="pill" data-theme="outline" data-text="signin_with" data-size="large"></div>
        </div>
    </div>
    <div id="user-info">
        <div class="user-details">
            <img id="user-pic" src="" style="width:36px;height:36px;">
            <div><div id="user-name" style="font-weight:600; font-size:14px;"></div><div id="user-email" style="font-size:11px;color:#5b6b82;"></div></div>
        </div>
        <button id="logout-btn" onclick="signOut()" style="padding:6px 14px; font-size:13px;">Выйти</button>
    </div>
    <div id="main-content" style="display:none;">
        <div class="form-card">
            <div class="form-title"><i class="fas fa-layer-group"></i> Новый заказ (несколько позиций)</div>
            <select id="clubSelect" style="margin-bottom:12px;">
                <option value="" disabled selected>— Выберите боулинг-клуб —</option>
                <option value="BLOCKBUSTER">BLOCKBUSTER</option>
                <option value="SKYMALL">SKYMALL</option>
                <option value="LUCKY STRIKE KH">LUCKY STRIKE KH</option>
            </select>
            
            <div id="positionsContainer" class="items-container">
                <div class="position-item" data-idx="0">
                    <div class="double-input-row">
                        <div class="part-field"><input type="text" class="dynamic-part" placeholder="Номер детали" autocomplete="off" style="padding:9px 12px;"></div>
                        <div class="qty-field"><input type="number" class="dynamic-qty" placeholder="Кол-во" min="1" value="1" style="padding:9px 8px;"></div>
                        <button type="button" class="remove-icon" title="Удалить"><i class="fas fa-trash-alt"></i></button>
                    </div>
                </div>
            </div>
            
            <button type="button" id="addPositionBtn" class="add-position-btn"><i class="fas fa-plus-circle"></i> Добавить позицию</button>
            
            <div class="button-group">
                <button id="saveOrderBtn" class="save-btn" onclick="saveMultiOrder()"><i class="fas fa-save"></i> Сохранить все позиции</button>
                <button class="refresh-btn-under" onclick="manualRefresh()"><i class="fas fa-sync-alt"></i> Открыть список заказов</button>
            </div>
        </div>
        
        <div id="filterSearchBlock" class="filter-search-container">
            <div class="filter-section">
                <div class="filter-group"><select id="statusFilter"><option value="all">Все заказы</option><option value="active">Активные</option><option value="delivered">Доставленные</option></select></div>
                <div class="filter-group"><select id="clubFilter"><option value="all">Все клубы</option><option value="BLOCKBUSTER">BLOCKBUSTER</option><option value="SKYMALL">SKYMALL</option><option value="LUCKY STRIKE KH">LUCKY STRIKE KH</option></select></div>
            </div>
            <input type="text" id="searchInput" class="search-box" placeholder="Поиск по детали или клубу" onkeyup="applyFilters()">
        </div>
        <div id="ordersList"></div>
    </div>
</div>

<script>
const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbwa5IaKN__SXP6WDen5VXxfsHILUpz6Bk2IyuMOlBVLa6SKUR7eEjw2Sjj7Nm6_M4eTgg/exec';
const AUTH_SPREADSHEET_ID = '1v-R394u6sKzSdvmkh9qsbqhfkNZEi5lIXwo8BdT_lhQ';
const AUTH_SHEET_NAME = 'PARTS ORDER';
const AUTH_API_KEY = 'AIzaSyAXL0Hsfxy-g-AgYhnivj4x9gCB2rrtF-0';

let currentUser = null;
let currentUserNameFromSheet = null;
let allOrders = [];
let isLoading = false;
let positionCounter = 1;

// --- Динамические позиции (компактные) ---
function createPositionItem(idx) {
    const div = document.createElement('div');
    div.className = 'position-item';
    div.setAttribute('data-idx', idx);
    const rowDiv = document.createElement('div');
    rowDiv.className = 'double-input-row';
    rowDiv.innerHTML = `
        <div class="part-field"><input type="text" class="dynamic-part" placeholder="Номер детали" autocomplete="off" style="padding:9px 12px;"></div>
        <div class="qty-field"><input type="number" class="dynamic-qty" placeholder="Кол-во" min="1" value="1" style="padding:9px 8px;"></div>
        <button type="button" class="remove-icon" title="Удалить позицию"><i class="fas fa-trash-alt"></i></button>
    `;
    div.appendChild(rowDiv);
    const removeBtn = rowDiv.querySelector('.remove-icon');
    removeBtn.onclick = (e) => {
        e.preventDefault();
        const items = document.querySelectorAll('.position-item');
        if (items.length === 1) {
            showToast('Должна быть хотя бы одна позиция', true);
            return;
        }
        div.remove();
        toggleRemoveIconsVisibility();
    };
    return div;
}

function addNewPosition() {
    const container = document.getElementById('positionsContainer');
    const newItem = createPositionItem(positionCounter++);
    container.appendChild(newItem);
    const partInput = newItem.querySelector('.dynamic-part');
    if (partInput) partInput.focus();
    toggleRemoveIconsVisibility();
    showToast('Добавлена новая строка', false);
}

function toggleRemoveIconsVisibility() {
    const items = document.querySelectorAll('.position-item');
    items.forEach((item) => {
        const icon = item.querySelector('.remove-icon');
        if (icon) {
            if (items.length === 1) {
                icon.style.visibility = 'hidden';
                icon.style.opacity = '0';
            } else {
                icon.style.visibility = 'visible';
                icon.style.opacity = '1';
            }
        }
    });
}

function observeContainerChanges() {
    const container = document.getElementById('positionsContainer');
    if (!container) return;
    const observer = new MutationObserver(() => toggleRemoveIconsVisibility());
    observer.observe(container, { childList: true, subtree: false });
}

function collectPositions() {
    const items = document.querySelectorAll('.position-item');
    const positions = [];
    for (let item of items) {
        const partInput = item.querySelector('.dynamic-part');
        const qtyInput = item.querySelector('.dynamic-qty');
        let partNumber = partInput ? partInput.value.trim() : '';
        let quantity = qtyInput ? parseInt(qtyInput.value) : 0;
        if (partNumber !== '' && !isNaN(quantity) && quantity > 0) {
            positions.push({ partNumber, quantity });
        }
    }
    return positions;
}

function validateOrderInputs() {
    const club = document.getElementById('clubSelect').value;
    if (!club) { showToast('<i class="fas fa-exclamation-circle"></i> Выберите клуб', true); return null; }
    const positions = collectPositions();
    if (positions.length === 0) { showToast('<i class="fas fa-exclamation-circle"></i> Добавьте хотя бы одну позицию', true); return null; }
    return { club, positions };
}

async function saveMultiOrder() {
    const validation = validateOrderInputs();
    if (!validation) return;
    const { club, positions } = validation;
    
    const btn = document.getElementById('saveOrderBtn');
    const originalText = btn.innerHTML;
    btn.innerHTML = '<i class="fas fa-spinner fa-pulse"></i> Сохранение...';
    btn.disabled = true;
    
    let successCount = 0;
    let errors = [];
    const now = new Date();
    const timeISO = now.toISOString();
    
    for (let i = 0; i < positions.length; i++) {
        const pos = positions[i];
        try {
            const result = await callScriptAsync('addOrder', { 
                partNumber: pos.partNumber, 
                quantity: pos.quantity, 
                club: club,
                timestamp: timeISO
            });
            if (result && result.error) throw new Error(result.error);
            successCount++;
        } catch (err) {
            errors.push(`${pos.partNumber}: ${err.message}`);
        }
    }
    
    if (successCount > 0) {
        const timeStr = formatDateTime(now);
        let message = `<i class="fas fa-check-circle"></i> Сохранено ${successCount} позиций для ${club}<br>${timeStr}`;
        if (errors.length) message += `<br><small>Ошибки: ${errors.join('; ')}</small>`;
        showToast(message, errors.length > 0);
        
        // Сброс формы до одной чистой позиции
        document.getElementById('clubSelect').value = '';
        const container = document.getElementById('positionsContainer');
        container.innerHTML = '';
        positionCounter = 1;
        const firstItem = createPositionItem(0);
        container.appendChild(firstItem);
        const firstPart = firstItem.querySelector('.dynamic-part');
        const firstQty = firstItem.querySelector('.dynamic-qty');
        if (firstPart) firstPart.value = '';
        if (firstQty) firstQty.value = '1';
        toggleRemoveIconsVisibility();
        await loadOrders(true, null);
    } else {
        showToast(`<i class="fas fa-times-circle"></i> Не удалось сохранить: ${errors.join('; ')}`, true);
    }
    
    btn.innerHTML = originalText;
    btn.disabled = false;
}

// ----- CORE FUNCTIONS (Google Sheets) -----
function formatDateTime(date) {
    if (!date || !(date instanceof Date) || isNaN(date)) return '—';
    const day = String(date.getDate()).padStart(2, '0');
    const month = String(date.getMonth() + 1).padStart(2, '0');
    const year = date.getFullYear();
    const hours = String(date.getHours()).padStart(2, '0');
    const minutes = String(date.getMinutes()).padStart(2, '0');
    const seconds = String(date.getSeconds()).padStart(2, '0');
    return `${day}.${month}.${year} ${hours}:${minutes}:${seconds}`;
}

function parseTimestamp(timestamp) {
    if (!timestamp) return null;
    if (timestamp instanceof Date) return timestamp;
    if (typeof timestamp === 'string') {
        let date = new Date(timestamp);
        if (!isNaN(date)) return date;
        if (!isNaN(parseFloat(timestamp))) {
            const serial = parseFloat(timestamp);
            const dateFromSerial = new Date((serial - 25569) * 86400000);
            if (!isNaN(dateFromSerial)) return dateFromSerial;
        }
    }
    if (typeof timestamp === 'number') return new Date(timestamp);
    return null;
}

function showToast(msgHtml, isError = false) {
    const toast = document.createElement('div');
    toast.className = 'toast' + (isError ? ' error' : '');
    toast.innerHTML = msgHtml;
    document.body.appendChild(toast);
    setTimeout(() => toast.remove(), 2800);
}

function callScriptAsync(functionName, data) {
    return new Promise((resolve, reject) => {
        const callbackName = 'cb_' + Date.now() + '_' + Math.random().toString(36).substr(2, 8);
        window[callbackName] = function(response) {
            delete window[callbackName];
            if (response && response.error) reject(new Error(response.error));
            else resolve(response && response.result ? response.result : response);
        };
        const params = new URLSearchParams();
        params.append('fn', functionName);
        if (data) params.append('data', JSON.stringify(data));
        params.append('callback', callbackName);
        const script = document.createElement('script');
        script.src = `${SCRIPT_URL}?${params.toString()}`;
        script.onerror = () => { delete window[callbackName]; reject(new Error('Сетевая ошибка')); };
        document.body.appendChild(script);
        setTimeout(() => {
            if (window[callbackName]) {
                delete window[callbackName];
                reject(new Error('Таймаут запроса'));
            }
        }, 20000);
    });
}

function applyFilters() {
    const statusFilter = document.getElementById('statusFilter').value;
    const clubFilter = document.getElementById('clubFilter').value;
    const searchQuery = document.getElementById('searchInput').value.toLowerCase();
    let filteredOrders = [...allOrders];
    if (statusFilter === 'active') filteredOrders = filteredOrders.filter(order => order.status === 'Активно' || order.status === 'Активен' || !order.status);
    else if (statusFilter === 'delivered') filteredOrders = filteredOrders.filter(order => order.status === 'Доставлено');
    if (clubFilter !== 'all') filteredOrders = filteredOrders.filter(order => order.club === clubFilter);
    if (searchQuery) filteredOrders = filteredOrders.filter(order => 
        (order.partNumber && order.partNumber.toLowerCase().includes(searchQuery)) ||
        (order.club && order.club.toLowerCase().includes(searchQuery))
    );
    filteredOrders.sort((a, b) => {
        const dateA = a.timestampObj || (a.timestamp ? parseTimestamp(a.timestamp) : 0);
        const dateB = b.timestampObj || (b.timestamp ? parseTimestamp(b.timestamp) : 0);
        const timeA = dateA instanceof Date ? dateA.getTime() : 0;
        const timeB = dateB instanceof Date ? dateB.getTime() : 0;
        return timeB - timeA;
    });
    renderOrders(filteredOrders);
}

async function loadOrders(showLoading = true, highlightNewId = null) {
    if (isLoading) return;
    isLoading = true;
    const container = document.getElementById('ordersList');
    const filterBlock = document.getElementById('filterSearchBlock');
    if (filterBlock) filterBlock.style.display = 'none';
    if (container && showLoading) container.innerHTML = '<div class="empty-state"><div class="loading-spinner"></div><br>Загрузка...</div>';
    try {
        const orders = await callScriptAsync('getOrders');
        if (orders && orders.error) throw new Error(orders.error);
        allOrders = Array.isArray(orders) ? orders : [];
        allOrders.forEach(order => { order.timestampObj = order.timestamp ? parseTimestamp(order.timestamp) : null; });
        allOrders.sort((a,b) => (b.timestampObj?.getTime()||0) - (a.timestampObj?.getTime()||0));
        applyFilters();
        if (filterBlock) filterBlock.style.display = 'block';
        if (highlightNewId) {
            setTimeout(() => {
                const newCard = document.querySelector(`.card[data-row="${highlightNewId}"]`);
                if (newCard) { newCard.classList.add('new-order'); setTimeout(() => newCard.classList.remove('new-order'), 800); newCard.scrollIntoView({ behavior: 'smooth', block: 'center' }); }
            }, 100);
        }
        if (allOrders.length === 0 && container) container.innerHTML = '<div class="empty-state"><i class="fas fa-box-open"></i> Нет заказов</div>';
        return allOrders;
    } catch(err) {
        if (container) container.innerHTML = `<div class="empty-state"><i class="fas fa-exclamation-triangle"></i> ${escapeHtml(err.message)}<br><br><button onclick="manualRefresh()" style="margin-top:10px;padding:8px 20px; background:#1a2f40; color:white; border-radius:40px;">↻ Повторить</button></div>`;
        if (filterBlock) filterBlock.style.display = 'none';
        showToast(`Ошибка: ${err.message}`, true);
        return [];
    } finally { isLoading = false; }
}

async function manualRefresh() { await loadOrders(true); }

async function updateStatus(row, newStatus, selectElement) {
    if (!selectElement) return;
    const originalValue = selectElement.value;
    selectElement.disabled = true; selectElement.style.opacity = '0.6';
    try {
        const result = await callScriptAsync('updateStatus', { row, status: newStatus });
        if (result && result.error) throw new Error(result.error);
        const idx = allOrders.findIndex(o => o.row == row);
        if (idx !== -1) allOrders[idx].status = newStatus;
        applyFilters();
        showToast(`Статус → "${newStatus}"`);
    } catch(err) {
        showToast(`Ошибка: ${err.message}`, true);
        selectElement.value = originalValue;
    } finally { selectElement.disabled = false; selectElement.style.opacity = '1'; }
}

async function deleteOrder(row, cardElement) {
    if (!confirm('Удалить заказ навсегда?')) return;
    const card = cardElement.closest('.card');
    if (card) { card.style.opacity = '0.5'; card.style.pointerEvents = 'none'; }
    try {
        const result = await callScriptAsync('deleteOrder', { row });
        if (result && result.error) throw new Error(result.error);
        const idx = allOrders.findIndex(o => o.row == row);
        if (idx !== -1) allOrders.splice(idx, 1);
        applyFilters();
        showToast('Заказ удалён');
    } catch(err) {
        showToast(`Ошибка удаления: ${err.message}`, true);
        if (card) { card.style.opacity = '1'; card.style.pointerEvents = 'auto'; }
    }
}

function renderOrders(orders) {
    const container = document.getElementById('ordersList');
    if (!container) return;
    if (!orders || orders.length === 0) {
        container.innerHTML = `<div class="empty-state"><i class="fas fa-box-open"></i> Нет заказов</div>`;
        return;
    }
    container.innerHTML = '';
    orders.forEach(order => {
        const card = document.createElement('div'); card.className = 'card'; card.setAttribute('data-row', order.row);
        let dateStr = '—';
        if (order.timestamp) { const d = parseTimestamp(order.timestamp); if (d && d instanceof Date && !isNaN(d)) dateStr = formatDateTime(d); }
        const table = document.createElement('table'); table.className = 'order-table';
        const currentStatus = order.status || 'Активно';
        const details = [
            { label: 'Номер детали', value: order.partNumber || '—' },
            { label: 'Количество', value: `${order.quantity} шт.` },
            { label: 'Клуб', value: order.club || '—' },
            { label: 'Дата/время', value: dateStr }
        ];
        details.forEach(d => {
            const tr = document.createElement('tr');
            const tdL = document.createElement('td'); tdL.textContent = d.label;
            const tdV = document.createElement('td'); tdV.textContent = d.value;
            tr.appendChild(tdL); tr.appendChild(tdV);
            table.appendChild(tr);
        });
        const statusTr = document.createElement('tr');
        const statusTdL = document.createElement('td'); statusTdL.textContent = 'Статус';
        const statusTdV = document.createElement('td');
        const select = document.createElement('select');
        select.className = `status-select ${currentStatus === 'Доставлено' ? 'status-delivered' : 'status-pending'}`;
        select.innerHTML = `<option value="Активно" ${currentStatus === 'Активно' ? 'selected' : ''}>Активно</option><option value="Доставлено" ${currentStatus === 'Доставлено' ? 'selected' : ''}>Доставлено</option>`;
        select.onchange = (e) => { e.stopPropagation(); updateStatus(order.row, select.value, select); };
        statusTdV.appendChild(select);
        statusTr.appendChild(statusTdL); statusTr.appendChild(statusTdV);
        table.appendChild(statusTr);
        card.appendChild(table);
        const actionDiv = document.createElement('div'); actionDiv.className = 'action-bar';
        const delBtn = document.createElement('button'); delBtn.innerHTML = '<i class="fas fa-trash-alt"></i> Удалить'; delBtn.className = 'action-btn delete-btn';
        delBtn.onclick = () => deleteOrder(order.row, card);
        actionDiv.appendChild(delBtn); card.appendChild(actionDiv);
        container.appendChild(card);
    });
}

function escapeHtml(str) { if(!str) return ''; return String(str).replace(/[&<>]/g, m => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;' }[m])); }

// --- AUTH & GOOGLE SHEETS (без изменений логики, но сохранена компактность)---
function loadSheetsAPI() { return new Promise((resolve, reject) => { gapi.load('client', { callback: resolve, onerror: reject, timeout: 10000 }); }); }
function handleCredentialResponse(response) { try { const payload = parseJwt(response.credential); currentUser = { email: payload.email.toLowerCase().trim(), name: payload.name, picture: payload.picture }; showLoadingAuth(true); initAndCheckEmail(); } catch(e) { showLoadingAuth(false); alert('Ошибка входа'); } }
function showLoadingAuth(show) { const container = document.getElementById('login-container'); if (show && container) { if (!container.hasAttribute('data-original')) container.setAttribute('data-original', container.innerHTML); container.innerHTML = '<div style="padding:30px;"><div class="loading-spinner"></div><br>Проверка...</div>'; } else if (container && container.getAttribute('data-original')) { container.innerHTML = container.getAttribute('data-original'); if (window.google?.accounts?.id) { google.accounts.id.renderButton(document.querySelector('.g_id_signin'), { type:'standard', shape:'pill', theme:'outline', text:'signin_with', size:'large' }); } } }
async function initAndCheckEmail() { try { await loadSheetsAPI(); await gapi.client.init({ apiKey: AUTH_API_KEY, discoveryDocs: ['https://sheets.googleapis.com/$discovery/rest?version=v4'] }); await checkEmailAndSiteInSheet(currentUser.email); } catch(err) { showLoadingAuth(false); alert('Ошибка API: ' + err.message); } }
async function checkEmailAndSiteInSheet(email) { try { const resp = await gapi.client.sheets.spreadsheets.values.get({ spreadsheetId: AUTH_SPREADSHEET_ID, range: `${AUTH_SHEET_NAME}!A:C` }); const rows = resp.result.values || []; let hasAccess = false, foundName = null; for (let row of rows) { if (row[0] && row[0].toLowerCase().trim() === email) { hasAccess = true; if(row[1]) foundName = row[1]; break; } } if (hasAccess) { currentUserNameFromSheet = foundName || currentUser.name; loginUser(currentUser); } else { showLoadingAuth(false); alert('Нет доступа! Ваш email не авторизован.'); } } catch(e) { showLoadingAuth(false); alert('Ошибка таблицы: ' + e.message); } }
async function loginUser(user) { document.getElementById('login-section').style.display = 'none'; document.getElementById('user-info').style.display = 'flex'; document.getElementById('main-content').style.display = 'block'; document.getElementById('user-pic').src = user.picture; document.getElementById('user-name').innerText = currentUserNameFromSheet || user.name; document.getElementById('user-email').innerText = user.email; localStorage.setItem('userLoggedIn', 'true'); localStorage.setItem('userEmail', user.email); localStorage.setItem('userName', user.name); localStorage.setItem('userPic', user.picture); await loadOrders(true); }
function parseJwt(token) { try { const base64Url = token.split('.')[1]; const base64 = base64Url.replace(/-/g,'+').replace(/_/g,'/'); return JSON.parse(decodeURIComponent(atob(base64).split('').map(c=>'%'+('00'+c.charCodeAt(0).toString(16)).slice(-2)).join(''))); } catch(e){ return {}; } }
function signOut() { localStorage.clear(); if(google?.accounts?.id) google.accounts.id.disableAutoSelect(); location.reload(); }

window.saveMultiOrder = saveMultiOrder;
window.updateStatus = updateStatus;
window.deleteOrder = deleteOrder;
window.signOut = signOut;
window.handleCredentialResponse = handleCredentialResponse;
window.loadOrders = loadOrders;
window.applyFilters = applyFilters;
window.manualRefresh = manualRefresh;

window.addEventListener('load', async () => {
    document.getElementById('addPositionBtn').onclick = () => addNewPosition();
    observeContainerChanges();
    toggleRemoveIconsVisibility();
    
    const logged = localStorage.getItem('userLoggedIn') === 'true';
    const savedEmail = localStorage.getItem('userEmail');
    if (logged && savedEmail) {
        document.getElementById('login-section').style.display = 'none';
        document.getElementById('user-info').style.display = 'flex';
        document.getElementById('main-content').style.display = 'block';
        document.getElementById('user-pic').src = localStorage.getItem('userPic') || '';
        document.getElementById('user-name').innerText = localStorage.getItem('userName') || 'User';
        document.getElementById('user-email').innerText = savedEmail;
        currentUser = { email: savedEmail, name: localStorage.getItem('userName'), picture: localStorage.getItem('userPic') };
        try {
            await loadSheetsAPI();
            await gapi.client.init({ apiKey: AUTH_API_KEY, discoveryDocs: ['https://sheets.googleapis.com/$discovery/rest?version=v4'] });
            const resp = await gapi.client.sheets.spreadsheets.values.get({ spreadsheetId: AUTH_SPREADSHEET_ID, range: `${AUTH_SHEET_NAME}!A:C` });
            const rows = resp.result.values || [];
            let hasAccess = false;
            for (let row of rows) if (row[0] && row[0].toLowerCase().trim() === savedEmail.toLowerCase().trim()) { hasAccess = true; break; }
            if (hasAccess) { await loadOrders(true); } else { showToast('Нет доступа к таблице', true); document.getElementById('ordersList').innerHTML = '<div class="empty-state"><i class="fas fa-ban"></i> Нет доступа</div>'; }
        } catch(err) { console.error(err); document.getElementById('ordersList').innerHTML = `<div class="empty-state"><i class="fas fa-exclamation-triangle"></i> Ошибка: ${err.message}<br><button onclick="manualRefresh()" style="margin-top:10px;">↻</button></div>`; }
    } else {
        document.getElementById('login-section').style.display = 'flex';
        if (google?.accounts?.id) { google.accounts.id.initialize({ client_id: '328749588235-bgfeukqogpoq2ha65j7j0vk840hctiaq.apps.googleusercontent.com', callback: handleCredentialResponse }); google.accounts.id.renderButton(document.querySelector('.g_id_signin'), { type:'standard', shape:'pill', theme:'outline', text:'signin_with', size:'large' }); }
    }
});
document.addEventListener('DOMContentLoaded', () => {
    document.getElementById('statusFilter')?.addEventListener('change', applyFilters);
    document.getElementById('clubFilter')?.addEventListener('change', applyFilters);
    document.getElementById('searchInput')?.addEventListener('keyup', applyFilters);
});
</script>
</body>
</html>
